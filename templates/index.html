<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        /* Main UI Colors */
        :root {
            --primary-color: #6a0dad;
            --secondary-color: #9b59b6;
            --background-color: #f4f0ff;
            --chat-bubble-user: #6a0dad;
            --chat-bubble-bot: #e5d4ff;
            --code-bg-color: #2d2d2d;
            --code-text-color: #f8f8f2;
        }

        body {
            background: var(--background-color);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 100%;
            border-radius: 0;
            overflow: hidden;
            background: white;
        }

        /* Sidebar (Options Section) */
        .options-section {
            width: 30%;
            padding: 20px;
            background: var(--secondary-color);
            color: white;
            overflow-y: auto;
        }

        .options-section h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-select, button {
            border-radius: 8px;
        }

        .btn {
            font-size: 1rem;
            font-weight: bold;
        }

        /* Chat Section */
        .chat-section {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: var(--background-color);
            display: flex;
            flex-direction: column;
        }

        /* Chat Input */
        .chat-input {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 2px solid var(--primary-color);
            align-items: center;
        }

        .chat-input textarea {
            flex: 1;
            resize: none;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d0d8e2;
            font-size: 1rem;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            background: var(--secondary-color);
        }

        /* Chat Message Bubbles */
        .chat-message {
            margin-bottom: 10px;
            display: flex;
        }

        .chat-message.bot {
            justify-content: flex-start;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message .message {
            max-width: 70%;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Bot and User Message Colors */
        .chat-message.bot .message {
            background: var(--chat-bubble-bot);
            color: black;
        }

        .chat-message.user .message {
            background: var(--chat-bubble-user);
            color: white;
        }

        /* Code Formatting */
        pre {
            background: var(--code-bg-color);
            color: var(--code-text-color);
            /* padding: 2px; */
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 2;
        }

        code {
            background: var(--code-bg-color);
            color: var(--code-text-color);
            padding: 5px 2px;
            /* border-radius: 4px; */
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }

        /* Smooth Scroll */
        .chat-box {
            scroll-behavior: smooth;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="options-section">
            <h3>Options</h3>
            <label for="course-dropdown">Course</label>
            <select id="course-dropdown" class="form-select mb-3">
                <option value="">Select a course...</option>
            </select>
            <label for="week-dropdown">Week</label>
            <select id="week-dropdown" class="form-select mb-3" disabled>
                <option value="">Select a week...</option>
            </select>
            <label for="day-dropdown">Day</label>
            <select id="day-dropdown" class="form-select mb-3" disabled>
                <option value="">Select a day...</option>
            </select>
            <label for="topic-dropdown">Topic</label>
            <select id="topic-dropdown" class="form-select mb-3" disabled>
                <option value="">Select a topic...</option>
            </select>
            <button class="btn btn-light w-100 mt-3" onclick="fetchShortExplanation()">Submit</button>
            <button id="generate-ppt-btn" class="btn btn-light w-100 mt-3" onclick="generateAndViewPPT()" disabled>Generate PPT</button>
            <button class="btn btn-dark w-100 mt-3" onclick="redirectToQuiz()">Take Quiz</button>
        </div>

        <div class="chat-section">
            <div class="chat-header">AI Chatbot</div>
            <div class="chat-box" id="chat-box"></div>
            <div class="chat-input">
                <textarea id="user-input" rows="1" placeholder="Type your message..."></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        let informationalText = ""; // Store the chatbot's response globally
        
        // Populate dropdowns dynamically
        document.addEventListener("DOMContentLoaded", () => {
            axios.get('/get_courses')
                .then(response => populateDropdown("course-dropdown", response.data.courses))
                .catch(error => console.error('Error fetching courses:', error));

            document.getElementById("course-dropdown").addEventListener("change", (event) => {
                const selectedCourse = event.target.value;
                if (selectedCourse) {
                    axios.post('/get_weeks', { course: selectedCourse })
                        .then(response => {
                            populateDropdown("week-dropdown", response.data.weeks);
                            document.getElementById("week-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching weeks:', error));
                }
            });

            document.getElementById("week-dropdown").addEventListener("change", (event) => {
                const selectedWeek = event.target.value;
                const selectedCourse = document.getElementById("course-dropdown").value;

                if (selectedWeek && selectedCourse) {
                    axios.post('/get_days', { course: selectedCourse, week: selectedWeek })
                        .then(response => {
                            populateDropdown("day-dropdown", response.data.days);
                            document.getElementById("day-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching days:', error));
                }
            });

            document.getElementById("day-dropdown").addEventListener("change", (event) => {
                const selectedWeek = document.getElementById("week-dropdown").value;
                const selectedCourse = document.getElementById("course-dropdown").value;
                const selectedDay = event.target.value;

                if (selectedWeek && selectedCourse && selectedDay) {
                    axios.post('/get_topics', { course: selectedCourse, week: selectedWeek, day: selectedDay })
                        .then(response => {
                            populateDropdown("topic-dropdown", response.data.topics);
                            document.getElementById("topic-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching topics:', error));
                }
            });
        });

        function fetchShortExplanation() {
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (course && week && day && topic) {
                appendMarkdownMessage('user', `**Course:** ${course}\n\n**Week:** ${week}\n\n**Day:** ${day}\n\n**Topic:** ${topic}`);


                axios.post('/teach_topic', { course, week, day, topic })
                    .then(response => {
                        informationalText = response.data.explanation; // Save the response
                        appendMarkdownMessage('bot', informationalText);

                        // Enable the "Generate and View PPT" button
                        const generatePptBtn = document.getElementById('generate-ppt-btn');
                        generatePptBtn.disabled = false;
                    })
                    .catch(error => {
                        console.error('Error fetching explanation:', error);
                        alert('Failed to fetch explanation. Please try again.');
                    });
            } else {
                alert('Please make all selections.');
            }
        }

        function generateAndViewPPT() {
            if (!informationalText) {
                alert('No informational text available. Please fetch explanation first.');
                return;
            }

            // Call the /generate_presentation endpoint
            axios.post('/generate_presentation', { informational_text: informationalText })
                .then(response => {
                    const downloadUrl = response.data.download_url;

                    // Open the new page with the generated PPT link
                    window.open(downloadUrl, '_blank');
                })
                .catch(error => {
                    console.error('Error generating PPT:', error);
                    alert('Failed to generate the presentation. Please try again.');
                });
        }

        function populateDropdown(id, options) {
            const dropdown = document.getElementById(id);
            dropdown.innerHTML = '<option value="">Select an option...</option>';
            options.forEach(option => {
                const opt = document.createElement("option");
                opt.value = option;
                opt.textContent = option;
                dropdown.appendChild(opt);
            });
        }

        function appendMessage(sender, messageContent) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.textContent = messageContent;

            messageDiv.appendChild(messageBubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMarkdownMessage(sender, markdownContent) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.innerHTML = marked.parse(markdownContent);

            // Add syntax highlighting to code blocks
            messageBubble.querySelectorAll('pre code').forEach(block => {
                // block.style.backgroundColor = '#2d3436';
                // block.style.color = '#dfe6e9';
                // block.style.padding = '10px';
                block.style.borderRadius = '8px';
                block.style.fontFamily = 'Courier New, Courier, monospace';
                block.style.overflowX = 'auto';
            });

            messageDiv.appendChild(messageBubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendThinkingMessage() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'chat-message bot thinking';
            thinkingDiv.id = 'thinking-message';

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.textContent = 'Bot is thinking...';

            thinkingDiv.appendChild(messageBubble);
            chatBox.appendChild(thinkingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeThinkingMessage() {
            const thinkingMessage = document.getElementById('thinking-message');
            if (thinkingMessage) {
                thinkingMessage.remove();
            }
        }

        function sendMessage() {
            const message = userInput.value.trim();
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (message) {
                appendMessage('user', message); // User message
                appendThinkingMessage(); // Show "Bot is thinking..."
                
                axios.post('/chat', { message, course, week, day, topic })
                    .then(response => {
                        removeThinkingMessage(); // Remove "Bot is thinking..."
                        appendMarkdownMessage('bot', response.data.reply); // Bot response
                    })
                    .catch(error => {
                        removeThinkingMessage(); // Remove "Bot is thinking..."
                        appendMessage('bot', 'Sorry, something went wrong.');
                        console.error('Error sending message:', error);
                    });

                userInput.value = '';
            } else {
                alert('Please type a message.');
            }
        }


        // Redirect to Quiz Page
        function redirectToQuiz() {
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (course && week && day && topic) {
                const queryParams = new URLSearchParams({ course, week, day, topic }).toString();
                window.location.href = `/quiz?${queryParams}`;
            } else {
                alert('Please make all selections before starting the quiz.');
            }
        }
    </script>
</body>

</html>
