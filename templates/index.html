<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        .options-section {
            width: 25%;
            padding: 20px;
            border-right: 2px solid #dcdcdc;
            overflow-y: auto;
            background-color: #e9f0f7;
        }

        .chat-section {
            width: 75%;
            display: flex;
            flex-direction: column;
            background-color: #f7faff;
        }

        .chat-header {
            background-color: #4a90e2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.8rem;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #dcdcdc;
            background-color: #e9f0f7;
        }

        .chat-input textarea {
            flex: 1;
            resize: none;
            padding: 10px;
            border: 1px solid #bfc9d1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 10px 20px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .chat-input button:hover {
            background-color: #357abd;
        }

        .chat-message {
            margin-bottom: 10px;
            display: flex;
        }

        .chat-message.bot {
            justify-content: flex-start;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message .message {
            max-width: 70%;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-message.bot .message {
            background-color: #d9ecf8;
            color: #2c3e50;
            white-space: pre-wrap;
        }

        .chat-message.user .message {
            background-color: #4a90e2;
            color: white;
        }

        .chat-message.thinking .message {
            background-color: #f0f4f8;
            font-style: italic;
            color: #999;
        }

        pre {
            background-color: #2d3436;
            color: #dfe6e9;
            padding: 2px;
            border-radius: 8px;
            overflow-x: auto; /* Enables horizontal scrolling */
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap; /* Ensures text wraps properly within the block */
            line-height: 1; /* Adjusts the line spacing to prevent overlap */
        }

        code {
            background-color: #f0f4f8;
            color: #2c3e50;
            padding: 2px 2px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 2; /* Adjusts line spacing for inline code */
        }

        .dropdown-group {
            margin-bottom: 20px;
        }

        h3 {
            color: #34495e;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        select.form-select {
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="options-section">
            <h3>Options</h3>

            <div class="dropdown-group">
                <label for="course-dropdown">Course</label>
                <select id="course-dropdown" class="form-select mb-3">
                    <option value="">Select a course...</option>
                </select>
            </div>

            <div class="dropdown-group">
                <label for="week-dropdown">Week</label>
                <select id="week-dropdown" class="form-select mb-3" disabled>
                    <option value="">Select a week...</option>
                </select>
            </div>

            <div class="dropdown-group">
                <label for="day-dropdown">Day</label>
                <select id="day-dropdown" class="form-select mb-3" disabled>
                    <option value="">Select a day...</option>
                </select>
            </div>

            <div class="dropdown-group">
                <label for="topic-dropdown">Topic</label>
                <select id="topic-dropdown" class="form-select mb-3" disabled>
                    <option value="">Select a topic...</option>
                </select>
            </div>

            <button class="btn btn-primary w-100" onclick="fetchShortExplanation()">Submit</button>
            <button class="btn btn-secondary w-100 mt-3" onclick="redirectToQuiz()">Take Quiz</button>
        </div>

        <div class="chat-section">
            <div class="chat-header">Chatbot</div>

            <div class="chat-box" id="chat-box">
                <!-- Messages will appear here -->
            </div>

            <div class="chat-input">
                <textarea id="user-input" rows="1" placeholder="Type your question here..."></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        
        // Populate dropdowns dynamically
        document.addEventListener("DOMContentLoaded", () => {
            axios.get('/get_courses')
                .then(response => populateDropdown("course-dropdown", response.data.courses))
                .catch(error => console.error('Error fetching courses:', error));

            document.getElementById("course-dropdown").addEventListener("change", (event) => {
                const selectedCourse = event.target.value;
                if (selectedCourse) {
                    axios.post('/get_weeks', { course: selectedCourse })
                        .then(response => {
                            populateDropdown("week-dropdown", response.data.weeks);
                            document.getElementById("week-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching weeks:', error));
                }
            });

            document.getElementById("week-dropdown").addEventListener("change", (event) => {
                const selectedWeek = event.target.value;
                const selectedCourse = document.getElementById("course-dropdown").value;

                if (selectedWeek && selectedCourse) {
                    axios.post('/get_days', { course: selectedCourse, week: selectedWeek })
                        .then(response => {
                            populateDropdown("day-dropdown", response.data.days);
                            document.getElementById("day-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching days:', error));
                }
            });

            document.getElementById("day-dropdown").addEventListener("change", (event) => {
                const selectedWeek = document.getElementById("week-dropdown").value;
                const selectedCourse = document.getElementById("course-dropdown").value;
                const selectedDay = event.target.value;

                if (selectedWeek && selectedCourse && selectedDay) {
                    axios.post('/get_topics', { course: selectedCourse, week: selectedWeek, day: selectedDay })
                        .then(response => {
                            populateDropdown("topic-dropdown", response.data.topics);
                            document.getElementById("topic-dropdown").disabled = false;
                        })
                        .catch(error => console.error('Error fetching topics:', error));
                }
            });
        });

        function fetchShortExplanation() {
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (course && week && day && topic) {
                appendMessage('user', `Selected: ${course}, ${week}, ${day}, ${topic}`);
                axios.post('/teach_topic', { course, week, day, topic })
                    .then(response => {
                        appendMarkdownMessage('bot', response.data.explanation);
                    })
                    .catch(error => console.error('Error fetching explanation:', error));
            } else {
                alert('Please make all selections.');
            }
        }

        function populateDropdown(id, options) {
            const dropdown = document.getElementById(id);
            dropdown.innerHTML = '<option value="">Select an option...</option>';
            options.forEach(option => {
                const opt = document.createElement("option");
                opt.value = option;
                opt.textContent = option;
                dropdown.appendChild(opt);
            });
        }

        function appendMessage(sender, messageContent) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.textContent = messageContent;

            messageDiv.appendChild(messageBubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMarkdownMessage(sender, markdownContent) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.innerHTML = marked.parse(markdownContent);

            // Add syntax highlighting to code blocks
            messageBubble.querySelectorAll('pre code').forEach(block => {
                block.style.backgroundColor = '#2d3436';
                block.style.color = '#dfe6e9';
                block.style.padding = '10px';
                block.style.borderRadius = '8px';
                block.style.fontFamily = 'Courier New, Courier, monospace';
                block.style.overflowX = 'auto';
            });

            messageDiv.appendChild(messageBubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendThinkingMessage() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'chat-message bot thinking';
            thinkingDiv.id = 'thinking-message';

            const messageBubble = document.createElement('div');
            messageBubble.className = 'message';
            messageBubble.textContent = 'Bot is thinking...';

            thinkingDiv.appendChild(messageBubble);
            chatBox.appendChild(thinkingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeThinkingMessage() {
            const thinkingMessage = document.getElementById('thinking-message');
            if (thinkingMessage) {
                thinkingMessage.remove();
            }
        }

        function sendMessage() {
            const message = userInput.value.trim();
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (message) {
                appendMessage('user', message); // User message
                appendThinkingMessage(); // Show "Bot is thinking..."
                
                axios.post('/chat', { message, course, week, day, topic })
                    .then(response => {
                        removeThinkingMessage(); // Remove "Bot is thinking..."
                        appendMarkdownMessage('bot', response.data.reply); // Bot response
                    })
                    .catch(error => {
                        removeThinkingMessage(); // Remove "Bot is thinking..."
                        appendMessage('bot', 'Sorry, something went wrong.');
                        console.error('Error sending message:', error);
                    });

                userInput.value = '';
            } else {
                alert('Please type a message.');
            }
        }


        // Redirect to Quiz Page
        function redirectToQuiz() {
            const course = document.getElementById("course-dropdown").value;
            const week = document.getElementById("week-dropdown").value;
            const day = document.getElementById("day-dropdown").value;
            const topic = document.getElementById("topic-dropdown").value;

            if (course && week && day && topic) {
                const queryParams = new URLSearchParams({ course, week, day, topic }).toString();
                window.location.href = `/quiz?${queryParams}`;
            } else {
                alert('Please make all selections before starting the quiz.');
            }
        }
    </script>
</body>

</html>
